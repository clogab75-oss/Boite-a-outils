<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🧰 Ma Boîte à Outils</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --txt:#241a4d;--dim:#6b6489;--r:20px;
  font-family:"Segoe UI",Inter,system-ui,sans-serif;
  --mx:50;--my:35;
}
html{scroll-behavior:smooth}
body{color:var(--txt);min-height:100vh;overflow-x:hidden}
#bgFx{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#ff9a9e,#a18cd1,#fbc2eb,#8fd3f4);
  background-size:400% 400%;animation:gradShift 18s ease infinite}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bgGlow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(560px circle at calc(var(--mx)*1%) calc(var(--my)*1%),rgba(255,236,120,.55),transparent 60%),
    radial-gradient(760px circle at calc(100% - var(--mx)*1%) calc(var(--my)*1%),rgba(120,220,255,.5),transparent 60%),
    radial-gradient(900px circle at calc(var(--mx)*1%) calc(100% - var(--my)*1%),rgba(255,130,220,.42),transparent 60%);
}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,.35))}
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(255,255,255,.65);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.6)}
#topbar h1{font-size:17px;font-weight:900;letter-spacing:.5px;color:#2b1e63;white-space:nowrap}
#btnHome{display:none;background:linear-gradient(135deg,#ff5c8a,#a18cd1);color:#fff;border:none;
  border-radius:14px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(161,140,209,.5)}
body.inTool #btnHome{display:inline-block}
#btnHome:active{transform:scale(.95)}
#crumb{color:var(--dim);font-size:12px;flex:1;text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#savedTag{display:none;font-size:10px;color:#00a583;font-weight:800;letter-spacing:1px}
#home{max-width:1150px;margin:0 auto;padding:28px 16px 40px}
body.inTool #home{display:none}
#hero{text-align:center;margin-bottom:18px}
#hero h2{font-size:clamp(26px,5.5vw,44px);font-weight:900;letter-spacing:-.5px;color:#fff;
  text-shadow:0 2px 0 #c9a6ff,0 6px 24px rgba(90,60,180,.45)}
#hero p{color:#3a2f6b;margin-top:10px;font-size:13px;letter-spacing:1.5px;font-weight:700}
#searchWrap{max-width:560px;margin:16px auto 0;position:relative}
#search{font-size:16px;padding:13px 44px 13px 18px;border-radius:16px;width:100%;
  background:rgba(255,255,255,.9);border:1.5px solid rgba(255,255,255,.7);color:var(--txt);
  box-shadow:0 8px 24px rgba(80,50,160,.18);outline:none;font-family:inherit}
#search:focus{border-color:#a18cd1;box-shadow:0 0 0 4px rgba(161,140,209,.2)}
#searchCount{font-size:11px;color:#3a2f6b;margin-top:8px;font-weight:700;min-height:14px}
#cats{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px auto 18px;max-width:900px}
#cats .chip{font-size:11px}
#menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mbtn{background:rgba(255,255,255,.82);border:none;border-radius:var(--r);padding:16px 10px;text-align:center;
  cursor:pointer;box-shadow:0 8px 24px rgba(80,50,160,.18);transition:.18s;
  display:flex;flex-direction:column;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.mbtn:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 34px rgba(80,50,160,.35)}
.mbtn:active{transform:scale(.96)}
.mbtn .ico{font-size:30px;width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.06)}
.mbtn b{font-size:13px;color:#2b1e63}
.mbtn small{font-size:10px;color:var(--dim);line-height:1.3}
.c1 .ico{background:#ffd6e3}.c2 .ico{background:#ffedb8}.c3 .ico{background:#c9f0ff}
.c4 .ico{background:#cdf5d2}.c5 .ico{background:#e4d5ff}.c6 .ico{background:#ffdfd0}
.c7 .ico{background:#d6e6ff}.c8 .ico{background:#ffe9c2}.c9 .ico{background:#c8f7e3}
.c10 .ico{background:#eed2ff}.c11 .ico{background:#ffd6ec}.c12 .ico{background:#ccf1ff}
.c13 .ico{background:#fff3bf}.c14 .ico{background:#e0f2c9}.c15 .ico{background:#f4d6ff}
.c16 .ico{background:#c9eaff}.c17 .ico{background:#ffe0c2}.c18 .ico{background:#d9f7ef}
.c19 .ico{background:#f7d6d6}.c20 .ico{background:#d6f7f0}.c21 .ico{background:#ffeacc}
.c22 .ico{background:#e6d6ff}.c23 .ico{background:#ffd9e0}.c24 .ico{background:#dff5cc}
.c25 .ico{background:#cfe3ff}.c26 .ico{background:#ffe6f7}
.page{display:none;max-width:780px;margin:0 auto;padding:22px 16px 60px}
.page.show{display:block;animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tool-card{background:rgba(255,255,255,.9);border-radius:var(--r);box-shadow:0 10px 30px rgba(80,50,160,.2);
  padding:22px;margin-bottom:16px;backdrop-filter:blur(8px)}
.tool-card h3{font-size:18px;color:#2b1e63}
.tool-card .desc{color:var(--dim);font-size:12px;margin:4px 0 14px;font-weight:600}
label{display:block;font-size:12px;color:#584d80;margin:12px 0 5px;font-weight:700}
input,select,textarea{width:100%;background:#faf9ff;border:1.5px solid #e2def5;color:var(--txt);
  padding:11px 13px;border-radius:13px;font-size:15px;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:#a18cd1;background:#fff;box-shadow:0 0 0 3px rgba(161,140,209,.25)}
textarea{resize:vertical;min-height:80px}
button{background:linear-gradient(135deg,#8f7bff,#a18cd1);color:#fff;border:none;border-radius:13px;
  padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px;transition:.15s;font-family:inherit;
  box-shadow:0 5px 16px rgba(140,110,220,.35)}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:active{transform:scale(.96)}
button.ghost{background:rgba(255,255,255,.85);color:#2b1e63;box-shadow:0 3px 10px rgba(80,50,160,.15)}
button.green{background:linear-gradient(135deg,#00d4a0,#00a583);box-shadow:0 5px 16px rgba(0,180,140,.35)}
button.pink{background:linear-gradient(135deg,#ff6f9c,#e0306a);box-shadow:0 5px 16px rgba(255,90,140,.4)}
button.orange{background:linear-gradient(135deg,#ff9a3c,#e07020);box-shadow:0 5px 16px rgba(255,150,60,.4)}
.row{display:flex;gap:10px}.row>*{flex:1}
.out{background:#f4f1ff;border:1.5px dashed #cabcf0;border-radius:13px;padding:12px 14px;margin-top:12px;
  font-size:14px;min-height:38px;word-break:break-word;font-variant-numeric:tabular-nums;color:#3b3166}
.big{font-size:22px;font-weight:800;color:#4b2fd4}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:8px 14px;border-radius:22px;font-size:12px;border:1.5px solid #e2def5;
  background:#fff;color:#6b6489;cursor:pointer;font-weight:700;transition:.12s}
.chip:hover{border-color:#a18cd1}
.chip.sel{background:linear-gradient(135deg,#8f7bff,#c47bff);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(140,110,220,.4)}
.swatch{display:inline-block;width:42px;height:42px;border-radius:12px;border:2px solid #fff;cursor:pointer;margin:3px;
  box-shadow:0 3px 8px rgba(0,0,0,.2)}
#pixCanvas{image-rendering:pixelated;max-width:100%;border:1px solid #e2def5;border-radius:12px;background:
  repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.todo-item{display:flex;align-items:center;gap:10px;background:#f6f3ff;border-radius:13px;padding:10px 13px;margin-top:7px}
.todo-item.done span{text-decoration:line-through;color:var(--dim)}
.todo-item span{flex:1;font-size:14px}
.todo-item button{margin:0;padding:4px 10px;font-size:11px}
.kbdrow{display:flex;gap:6px;margin-top:6px}
.kbd{padding:14px 0;flex:1;min-width:52px;text-align:center;background:#f4f1ff;border:1px solid #e2def5;
  border-radius:13px;font-size:17px;cursor:pointer;font-weight:800;transition:.08s}
.kbd:active{background:#a18cd1;color:#fff}
.kbd.op{color:#7a5cd8}
.kbd.eq{background:linear-gradient(135deg,#8f7bff,#a18cd1);color:#fff}
#calcOut{text-align:right;font-size:26px;font-weight:800;min-height:32px;padding:14px;background:#f4f1ff;border-radius:13px;color:#3b3166}
.save-note{font-size:10px;color:#00a583;font-weight:700;letter-spacing:.5px;margin-top:8px}
footer{text-align:center;color:#4b3f7d;font-size:10px;padding:28px;letter-spacing:1.5px;font-weight:700}
#gradPrev{height:80px;border-radius:14px;margin-top:12px;border:1px solid #e2def5}
.notes-area{min-height:220px;font-size:15px;line-height:1.6}
#typeArea{background:#f6f3ff;border-radius:13px;padding:16px;font-size:16px;line-height:1.7;margin-top:12px;min-height:80px}
#typeArea .ok{color:#00a583;font-weight:700}
#typeArea .bad{color:#e0306a;text-decoration:underline}
#pomoTime{font-size:52px;font-weight:900;text-align:center;color:#4b2fd8;margin:10px 0}
.symgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sym{padding:9px 12px;border-radius:11px;background:#f4f1ff;border:1px solid #e2def5;font-size:17px;cursor:pointer;transition:.1s}
.sym:hover{background:#a18cd1;color:#fff;transform:scale(1.1)}
@media(max-width:600px){
  #menu{grid-template-columns:repeat(2,1fr);gap:10px}
  .mbtn{padding:12px 6px}.mbtn .ico{font-size:26px;width:50px;height:50px}
  .row{flex-direction:column}
  #topbar h1{font-size:14px}
}
</style>
</head>
<body>
<div id="bgFx"></div>
<div id="bgGlow"></div>

<div id="topbar">
  <button id="btnHome">⬅ Menu</button>
  <h1>🧰 Ma Boîte à Outils</h1>
  <span id="crumb"></span>
  <span id="savedTag">💾 SAUVEGARDÉ</span>
</div>

<div id="home">
  <div id="hero">
    <h2>Que voulez-vous faire ?</h2>
    <p id="heroSub">101 OUTILS · SAUVEGARDE AUTOMATIQUE · 100% HORS-LIGNE · MOBILE & PC</p>
  </div>
  <div id="searchWrap">
    <input type="text" id="search" placeholder="🔍 Rechercher un outil… (tapez et Entrée pour ouvrir)" autocomplete="off"/>

  </div>
  <div id="cats"></div>
  <div id="menu"></div>
</div>

<div id="pages"></div>

<footer>MA BOÎTE À OUTILS — VOS DONNÉES RESTENT DANS VOTRE NAVIGATEUR</footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>(+n).toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:0});
const esc=s=>String(s);

/* ============ SAUVEGARDE GÉNÉRIQUE ============ */
function lsGet(key,def){
  try{const v=localStorage.getItem("nova_"+key);
    return v===null?def:JSON.parse(v);}
  catch(e){return def;}
}
function lsSet(key,val){
  try{localStorage.setItem("nova_"+key,JSON.stringify(val));}catch(e){}
  flashSaved();
}
function flashSaved(){
  const t=$("savedTag");
  t.style.display="inline";
  clearTimeout(flashSaved._t);
  flashSaved._t=setTimeout(()=>{t.style.display="none";},1400);
}

/* ============ FOND : halo qui suit le pointeur ============ */
(function(){
  const root=document.documentElement;
  let tx=50,ty=35,cx=50,cy=35;
  addEventListener("pointermove",e=>{
    tx=e.clientX/innerWidth*100;ty=e.clientY/innerHeight*100;
  },{passive:true});
  addEventListener("touchmove",e=>{
    if(e.touches[0]){tx=e.touches[0].clientX/innerWidth*100;ty=e.touches[0].clientY/innerHeight*100;}
  },{passive:true});
  (function anim(){
    cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
    root.style.setProperty("--mx",cx.toFixed(2));
    root.style.setProperty("--my",cy.toFixed(2));
    requestAnimationFrame(anim);
  })();
})();

const GEN=[];
let clsIdx=0;
const nextCls=()=>{const c="c"+(1+clsIdx%26);clsIdx++;return c;};

/* --- Fabrique : convertisseur d'unités --- */
function convTool(id,ico,name,desc,cat,brief,units){
  const p=id;
  GEN.push({meta:{id:id,ico:ico,name:name,desc:desc,cat:cat,cls:nextCls(),brief:brief,
    html:'<label>Valeur</label><input type="number" id="'+p+'_v" value="1" step="any">'+
    '<div class="row"><div><label>De</label><select id="'+p+'_f"></select></div>'+
    '<div><label>Vers</label><select id="'+p+'_t"></select></div></div>'+
    '<div class="out big" id="'+p+'_o">—</div><div class="save-note">💾 Réglages sauvegardés</div>'},
    init:function(){
      const keys=Object.keys(units);
      const st=lsGet("cv_"+id,{v:1,f:keys[0],t:keys[1]||keys[0]});
      $(p+"_f").innerHTML=keys.map(k=>"<option>"+k+"</option>").join("");
      $(p+"_t").innerHTML=keys.map(k=>"<option>"+k+"</option>").join("");
      $(p+"_f").value=keys.indexOf(st.f)>=0?st.f:keys[0];
      $(p+"_t").value=keys.indexOf(st.t)>=0?st.t:keys[1]||keys[0];
      $(p+"_v").value=st.v;
      function conv(){
        const v=+$(p+"_v").value||0;
        const f=$(p+"_f").value,t=$(p+"_t").value;
        lsSet("cv_"+id,{v:v,f:f,t:t});
        const r=v*units[f]/units[t];
        $(p+"_o").textContent=fmt(v,4)+" "+f+" = "+fmt(r,6)+" "+t;
      }
      [p+"_v",p+"_f",p+"_t"].forEach(x=>$(x).addEventListener("input",conv));
      conv();
    }});
}
/* --- Fabrique : calculateur à champs --- */
function calcTool(id,ico,name,desc,cat,brief,fields,go,opts){
  opts=opts||{};
  const p=id;
  let html="";
  if(fields.length>1)html+='<div class="row">';
  fields.forEach(function(f){
    const tp=f[4]||"number";
    html+='<div><label>'+f[1]+'</label><input type="'+tp+'" id="'+p+"_"+f[0]+'" value="'+(f[2]!==undefined?f[2]:"")+'"'+(tp==="number"?' step="any"':"")+(f[3]?' placeholder="'+f[3]+'"':"")+'></div>';
  });
  if(fields.length>1)html+='</div>';
  if(opts.chips){
    html+='<div class="chips" id="'+p+'_ch">';
    opts.chips.forEach(function(c,i){
      html+='<div class="chip'+(i===(opts.ci||0)?' sel':'')+'" data-v="'+c[1]+'">'+c[0]+'</div>';
    });
    html+='</div>';
  }
  html+='<div class="out" id="'+p+'_o">—</div>';
  if(opts.note)html+='<div class="save-note">'+opts.note+'</div>';
  GEN.push({meta:{id:id,ico:ico,name:name,desc:desc,cat:cat,cls:nextCls(),brief:brief,html:html},
    init:function(){
      const st=lsGet("t_"+id,null);
      if(st)fields.forEach(function(f){if(st[f[0]]!==undefined)$(p+"_"+f[0]).value=st[f[0]];});
      let chipVal=opts.chips?opts.chips[opts.ci||0][1]:null;
      if(st&&st._c!==undefined&&opts.chips)chipVal=st._c;
      if(opts.chips){
        if(st&&st._c!==undefined)
          document.querySelectorAll("#"+p+"_ch .chip").forEach(function(c){
            c.classList.toggle("sel",c.dataset.v==chipVal);
          });
        document.querySelectorAll("#"+p+"_ch .chip").forEach(function(c){
          c.addEventListener("click",function(){
            document.querySelectorAll("#"+p+"_ch .chip").forEach(function(x){x.classList.remove("sel");});
            c.classList.add("sel");chipVal=c.dataset.v;run();
          });
        });
      }
      function run(){
        const v={},st2={_c:chipVal};
        fields.forEach(function(f){
          const val=$(p+"_"+f[0]).value;
          v[f[0]]=(f[4]&&f[4]!=="number")?String(val):(+val||0);
          st2[f[0]]=val;
        });
        lsSet("t_"+id,st2);
        let out;
        try{out=go(v,chipVal);}catch(e){out="— vérifiez les valeurs —";}
        $(p+"_o").innerHTML=out;
      }
      fields.forEach(function(f){$(p+"_"+f[0]).addEventListener("input",run);});
      run();
    }});
}
/* --- Fabrique : transformateur de texte --- */
function txtTool(id,ico,name,desc,cat,brief,go,btnLabel,btn2,go2){
  const p=id;
  let html='<textarea id="'+p+'_in" placeholder="Votre texte ici…"></textarea>'+
    '<button class="green" id="'+p+'_go">'+(btnLabel||"Transformer")+'</button>';
  if(btn2)html+='<button class="ghost" id="'+p+'_go2">'+btn2+'</button>';
  html+='<div class="out" id="'+p+'_out">—</div>'+
    '<button class="ghost" id="'+p+'_copy">📋 Copier le résultat</button>'+
    '<div class="save-note">💾 Sauvegarde automatique</div>';
  GEN.push({meta:{id:id,ico:ico,name:name,desc:desc,cat:cat,cls:nextCls(),brief:brief,html:html},
    init:function(){
      const ta=$(p+"_in");
      ta.value=lsGet("tx_"+id,"");
      let t=null;
      ta.addEventListener("input",function(){
        clearTimeout(t);t=setTimeout(()=>lsSet("tx_"+id,ta.value),400);
      });
      const run=fn=>{try{$(p+"_out").textContent=fn(ta.value);}catch(e){$(p+"_out").textContent="⚠️ "+e.message;}};
      $(p+"_go").addEventListener("click",()=>run(go));
      if(btn2)$(p+"_go2").addEventListener("click",()=>run(go2));
      $(p+"_copy").addEventListener("click",()=>{
        if(navigator.clipboard)navigator.clipboard.writeText($(p+"_out").textContent).then(()=>alert("Copié !"));
      });
    }});
}
/* --- Fabrique : action simple (boutons) --- */
function actTool(id,ico,name,desc,cat,brief,btns,fields,run){
  const p=id;
  let html="";
  if(fields&&fields.length){
    html+='<div class="row">';
    fields.forEach(function(f){
      html+='<div><label>'+f[1]+'</label><input type="'+(f[3]||"number")+'" id="'+p+"_"+f[0]+'" value="'+(f[2]!==undefined?f[2]:"")+'"'+(f[3]==="number"?' step="any"':"")+'></div>';
    });
    html+='</div>';
  }
  html+='<div class="chips" id="'+p+'_ch">';
  btns.forEach(function(b){html+='<div class="chip" data-v="'+b[1]+'">'+b[0]+'</div>';});
  html+='</div><div class="out" id="'+p+'_o">Cliquez sur un bouton ci-dessus…</div>';
  GEN.push({meta:{id:id,ico:ico,name:name,desc:desc,cat:cat,cls:nextCls(),brief:brief,html:html},
    init:function(){
      const vals={};
      if(fields)fields.forEach(f=>{vals[f[0]]=$(p+"_"+f[0]).value;
        $(p+"_"+f[0]).addEventListener("input",()=>vals[f[0]]=$(p+"_"+f[0]).value);});
      document.querySelectorAll("#"+p+"_ch .chip").forEach(c=>{
        c.addEventListener("click",()=>{
          let out;
          try{out=run(c.dataset.v,vals);}catch(e){out="⚠️ erreur";}
          $(p+"_o").innerHTML=out;
        });
      });
    }});
}
/* --- Fabrique : liste de symboles/emojis copiables --- */
function listTool(id,ico,name,desc,cat,brief,items){
  const p=id;
  let html='<div class="out" style="border-style:solid">Cliquez sur un élément pour le copier</div><div class="symgrid">';
  items.forEach(function(it){
    const parts=String(it).split("|");
    html+='<div class="sym" data-c="'+parts[0]+'" title="'+(parts[1]||"")+'">'+parts[0]+'</div>';
  });
  html+='</div>';
  GEN.push({meta:{id:id,ico:ico,name:name,desc:desc,cat:cat,cls:nextCls(),brief:brief,html:html},
    init:function(){
      document.querySelectorAll("#"+p+" .sym").forEach(function(s){
        s.addEventListener("click",function(){
          if(navigator.clipboard)navigator.clipboard.writeText(s.dataset.c);
          const old=s.textContent;s.textContent="✓";setTimeout(()=>{s.textContent=old;},600);
        });
      });
    }});
}

calcTool("semaine","🗓️","Semaine & jour de l'année","Date → infos","temps","Numéro de semaine ISO, jour de l'année, jour de la semaine.",

  v=>{const raw=$("semaine_d").value;if(!raw)return "Choisissez une date";
    const dt=new Date(raw+"T12:00:00");
    if(isNaN(dt))return "Date invalide";
    const t=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
    const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
    const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));
    const week=Math.ceil(((t-ys)/86400000+1)/7);
    const start=new Date(dt.getFullYear(),0,0);
    const doy=Math.floor((dt-start)/86400000);
    const jr=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"][day-1];
    return "<b>"+raw+"</b> : <b style='color:#00a583'>semaine "+week+"</b><br>"+
      "C'est un <b>"+jr+"</b> · jour <b>"+doy+"</b> de l'année (il reste "+(365-doy)+")";});

calcTool("lettre","✍️","Nombre en lettres","Français","maths","Écrivez un nombre en toutes lettres (jusqu'à 999 millions).",
  [["n","Nombre",2026]],
  v=>{function deux(n){
      const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
      if(n<20)return U[n];
      const d=Math.floor(n/10),u=n%10;
      if(d===7||d===9){const base=d===7?60:80,r=n-base;
        return (d===7?"soixante"+(r===1?" et un":"-"+U[r]):"quatre-vingt-"+U[r]);}
      if(d===8)return u===0?"quatre-vingts":"quatre-vingt-"+U[u];
      if(u===1)return ["vingt","trente","quarante","cinquante","soixante"][d-2]+" et un";
      return ["vingt","trente","quarante","cinquante","soixante"][d-2]+(u?"-"+U[u]:"");}
    function cent(n){
      const c=Math.floor(n/100),r=n%100;let s="";
      if(c===1)s="cent";else if(c>1)s=deux(c)+" cent"+(r===0?"s":"");
      if(r>0)s+=(s?" ":"")+deux(r);
      return s||"zéro";}
    const n=Math.floor(Math.abs(v.n));
    if(n>=1e9)return "Maximum : 999 999 999";
    if(n===0)return "<b>zéro</b>";
    const parts=[];
    const M=Math.floor(n/1e6),r=n%1e6,m2=Math.floor(r/1000),r2=r%1000;
    if(M>0)parts.push(M===1?"un million":cent(M)+" millions");
    if(m2>0)parts.push(m2===1?"mille":cent(m2)+" mille");
    if(r2>0)parts.push(r2===100?"cent":cent(r2));
    return fmt(n,0)+" = <b style='color:#00a583'>"+parts.join(" ")+"</b>";});
txtTool("romain","🏛️","Chiffres romains","Arabes ↔ romains","maths","Convertissez dans les deux sens.",
  s=>{const s2=s.trim().toUpperCase();
    if(!s2)return "Tapez un nombre (2026) ou un romain (MMXXVI)";
    if(/^[0-9]+$/.test(s2)){
      let n=+s2;
      if(n<1||n>3999)return "Entre 1 et 3999 seulement";
      const R=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
      let out="";
      R.forEach(p=>{while(n>=p[0]){out+=p[1];n-=p[0];}});
      return s2+" = <b>"+out+"</b>";
    }
    if(/^[MDCLXVI]+$/.test(s2)){
      const V={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
      let n=0;
      for(let i=0;i<s2.length;i++){

      }

    function one(){
      if(crypto.randomUUID)return crypto.randomUUID();
      const b=crypto.getRandomValues(new Uint8Array(16));
      b[6]=b[6]&15|64;b[8]=b[8]&63|128;
      const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");

INITS.pixel=function(){
  let pixImg=null,pixRows=null;
  const cv=$("pixCanvas"),ctx=cv.getContext("2d");
  const st=lsGet("pix_size",{w:16,h:16});
  $("pixW").value=st.w;$("pixH").value=st.h;
  $("pixFile").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{const im=new Image();im.onload=()=>{pixImg=im;go2();};im.src=ev.target.result;};
    r.readAsDataURL(f);
  });
  function go2(){
    if(!pixImg){alert("Choisissez d'abord une image !");return;}
    const w=Math.min(128,Math.max(2,+$("pixW").value||16));
    const h=Math.min(128,Math.max(2,+$("pixH").value||16));
    $("pixW").value=w;$("pixH").value=h;
    lsSet("pix_size",{w:w,h:h});
    cv.width=w;cv.height=h;
    ctx.clearRect(0,0,w,h);ctx.drawImage(pixImg,0,0,w,h);
    const d=ctx.getImageData(0,0,w,h).data,rows=[];
    for(let y=0;y<h;y++){
      const row=[];
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        row.push("#"+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,"0")).join(""));
      }
      rows.push(row.join(" "));
    }
    pixRows=rows;
    $("pixOut").textContent=rows.join("\n");
  }
  $("pixGo").addEventListener("click",go2);
  $("pixCopy").addEventListener("click",()=>{
    if(!pixRows){alert("Rien à copier : convertissez d'abord une image.");return;}
    const txt=pixRows.join("\n");
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(

INITS.color=function(){
  const st=lsGet("color_last","#6c5cff");
  function h2r(h){h=h.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const n=parseInt(h,16);return isNaN(n)?null:[n>>16&255,n>>8&255,n&255];}
  function r2Hsl(r,g,b){r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
    return[Math.round(h),Math.round(s*100),Math.round(l*100)];}
  function hsl2h(h,s,l){s/=100;l/=100;
    const a=s*Math.min(l,1-l),f=function(n){const k=(n+h/30)%12;
      return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1))).toString(16).padStart(2,"0");};
    return"#"+f(0)+f(8)+f(4);}
  function upd(hex){
    const rgb=h2r(hex);if(!rgb)return;
    const r=rgb[0],g=rgb[1],b=rgb[2],hs=r2Hsl(r,g,b),h=hs[0],s=hs[1],l=hs[2];
    const lum=Math.round(.299*r+.587*g+.114*b);
    $("colHex").value=hex;$("colPick").value=hex;
    lsSet("color_last",hex);
    $("colOut").innerHTML="HEX <b>"+hex.toUpperCase()+"</b> · RGB <b>"+r+", "+g+", "+b+"</b> · HSL <b>"+h+"°, "+s+"%, "+l+"%</b><br>"+
      "Texte lisible sur ce fond : <b>"+(lum>128?"⬜ blanc":"⬛ noir")+"</b>";
    const pals=[h,(h+30)%360,(h+180)%360,(h+120)%360,(h+240)%360,(h+150)%360];
    $("palette").innerHTML=pals.map(function(hh){
      const hx=hsl2h(hh,s,l);
      return '<span class="swatch" style="background:'+hx+'" title="'+hx+' — cliquez pour copier" data-h="'+hx+'"></span>';
    }).join("");
    document.querySelectorAll("#palette .swatch").forEach(function(sw){
      sw.addEventListener("click",function(){
        if(navigator.clipboard)navigator.clipboard.writeText(sw.dataset.h);
        alert(sw.dataset.h+" copié !");
      });
    });
  }
  $("colPick").addEventListener("input",e=>upd(e.target.value));
  $("colGo").addEventListener("click",()=>{let v=$("colHex").value.trim();upd(v.charAt(0)==="#"?v:"#"+v);});
  upd(st);
};
INITS.calc=function(){
  let expr="";
  const render=()=>{$("calcOut").textContent=expr||"0";};
  function press(k){
    if(k==="C")expr="";
    else if(k==="←")expr=expr.slice(0,-1);
    else if(k==="="){
      try{
        const c=expr.replace(/%/g,"/100").replace(/×/g,"*").replace(/÷/g,"/");
        if(c&&/^[0-9+\-*/().%\s]+$/.test(c))
          expr=String(Math.round(Function("\"use strict\";return("+c+")")()*1e10)/1e10);
      }catch(e){}
    }else expr+=k;
    render();
  }
  document.querySelectorAll("#page-calc .kbd").forEach(k=>k.addEventListener("click",()=>press(k.dataset.k)));
  addEventListener("keydown",function(e){
    if(!$("page-calc").classList.contains("show"))return;
    const tag=document.activeElement?document.activeElement.tagName:"";
    if(tag==="INPUT"||tag==="TEXTAREA")return;
    if(/^[0-9+\-*/().%]$/.test(e.key))press(e.key);
    else if(e.key==="Enter")press("=");
    else if(e.key==="Backspace")press("←");
    else if(e.key==="Escape")press("C");
  });
};

INITS.chrono=function(){
  let t0=0,acc=0,run=false,laps=[];
  function tick(){
    const ms=acc+(run?performance.now()-t0:0);
    const m=String(Math.floor(ms/60000)).padStart(2,"0"),
          s=String(Math.floor(ms/1000)%60).padStart(2,"0"),
          d=Math.floor(ms%1000/100);
    $("chronoOut").textContent=m+":"+s+"."+d;
    if(run)requestAnimationFrame(tick);
  }
  $("chStart").addEventListener("click",()=>{
    run=!run;$("chStart").textContent=run?"⏸ Pause":"▶ Démarrer";
    if(run){t0=performance.now();tick();}else acc+=performance.now()-t0;
  });
  $("chLap").addEventListener("click",()=>{
    const v=$("chronoOut").textContent;
    laps.unshift(v);laps=laps.slice(0,20);
    $("chLaps").innerHTML=laps.map((l,i)=>"Tour "+(laps.length-i)+" — <b>"+l+"</b>").join("<br>");
  });
  $("chReset").addEventListener("click",()=>{
    run=false;acc=0;laps=[];
    $("chStart").textContent="▶ Démarrer";
    $("chLaps").innerHTML="";$("chronoOut").textContent="00:00.0";
  });
  $("tmGo").addEventListener("click",()=>{
    const min=+$("tmMin").value||0,end=Date.now()+min*60000,btn=$("tmGo");
    btn.disabled=true;
    const iv=setInterval(()=>{
      const left=end-Date.now();
      btn.textContent="⏳ reste "+Math.max(0,Math.ceil(left/1000))+" s";
      if(left<=0){
        clearInterval(iv);btn.disabled=false;btn.textContent="🔔 Lancer le minuteur";
        try{
          const AC=new(window.AudioContext||window.webkitAudioContext)();
          const o=AC.createOscillator(),g=AC.createGain();
          o.frequency.value=880;g.gain.value=.3;
          o.connect(g);g.connect(AC.destination);o.start();
          o.stop(AC.currentTime+.5);
        }catch(e){}
        alert("⏰ C'est l'heure ! ("+min+" min écoulées)");
      }
    },500);
  });
};

  function conv2(){
    const v=+$("curVal").value||0,f=$("curFrom").value,t=$("curTo").value;
    lsSet("cur_state",{val:v,from:f,to:t});
    if(!rates){$("curOut").textContent="Chargement des taux…";return;}
    $("curOut").textContent=fmt(v,2)+" "+f+" = "+fmt(v*rates[t]/rates[f],2)+" "+t;
  }
  function applyRates(data,label){rates=data;$("curInfo").textContent=label;conv2();}
  async function loadRates(force){
    const cache=lsGet("cur_cache",null);
    if(!force&&cache&&(Date.now()-cache.t)<86400000){
      applyRates(cache.r,"Taux du cache ("+new Date(cache.t).toLocaleString("fr-FR")+") — cliquez sur ↻ pour actualiser");return;}
    if(!navigator.onLine){applyRates(FALLBACK,"⚠️ Hors-ligne : taux indicatifs figés");return;}
    try{
      const resp=await fetch("https://open.er-api.com/v6/latest/EUR");
      if(!resp.ok)throw new Error("http");
      const j=await resp.json();
      if(j&&j.rates){
        const sel={};Object.keys(NAMES).forEach(k=>{if(j.rates[k])sel[k]=j.rates[k];});
        lsSet("cur_cache",{t:Date.now(),rates:sel});
        applyRates(sel,"Taux en direct (open.er-api.com) — "+new Date().toLocaleTimeString("fr-FR"));
      }else throw new Error("bad");
    }catch(e){applyRates(FALLBACK,"⚠️ Pas de connexion aux taux — valeurs indicatives figées");}
  }
  $("curVal").addEventListener("input",conv2);
  $("curFrom").addEventListener("change",conv2);
  $("curTo").addEventListener("change",conv2);
  $("curGo").addEventListener("click",conv2);
  $("curRefresh").addEventListener("click",()=>loadRates(true));
  loadRates(false);
};
INITS.base=function(){
  function upd(from){
    let n;
    if(from==="nDec")n=parseInt($("nDec").value||"0",10);
    else if(from==="nBin")n=parseInt(($("nBin").value||"0").replace(/[^01]/g,""),2);
    else if(from==="nHex")n=parseInt(($("nHex").value||"0").replace(/[^0-9a-fA-F]/g,""),16);
    else n=parseInt(($("nOct").value||"0").replace(/[^0-7]/g,""),8);
    if(isNaN(n))n=0;
    n=Math.min(n,Number.MAX_SAFE_INTEGER);
    if(from!=="nDec")$("nDec").value=n;
    if(from!=="nBin")$("nBin").value=n.toString(2);
    if(from!=="nHex")$("nHex").value=n.toString(16).toUpperCase();
    if(from!=="nOct")$("nOct").value=n.toString(8);
    lsSet("base_last",{d:$("nDec").value});
  }
  ["nDec","nBin","nHex","nOct"].forEach(id=>$(id).addEventListener("input",()=>upd(id)));
  const last=lsGet("base_last",null);
  if(last&&last.d)$("nDec").value=last.d;
  upd("nDec");
};
INITS.imc=function(){
  const st=lsGet("imc_state",{sex:"h",h:175,w:70,a:25,act:"1.55"});
  let sex=st.sex;
  $("imcH").value=st.h;$("imcW").value=st.w;$("imcA").value=st.a;$("imcAct").value=st.act;
  document.querySelectorAll("#imcSex .chip").forEach(function(c){
    if(c.dataset.s===sex){document.querySelectorAll("#imcSex .chip").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");}
    c.addEventListener("click",()=>{
      document.querySelectorAll("#imcSex .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");sex=c.dataset.s;calc();
    });
  });
  function calc(){
    const h=+$("imcH").value||0,w=+$("imcW").value||0,a=+$("imcA").value||0,act=+$("imcAct").value||1.55;
    lsSet("imc_state",{sex:sex,h:h,w:w,a:a,act:act});
    if(h<50||w<15){$("imcOut").textContent="Entrez des valeurs réalistes.";return;}
    const imc=w/((h/100)*(h/100));
    const idealMin=18.5*(h/100)*(h/100),idealMax=25*(h/100)*(h/100);
    const bmr=10*w+6.25*h-5*a+(sex==="h"?5:-161);
    const kcal=bmr*act;
    const cat=imc<18.5?"insuffisant ⬇️":imc<25?"normal ✅":imc<30?"surpoids ⚠️":imc<40?"obésité 🔴":"obésité sévère 🔴🔴";
    $("imcOut").innerHTML=
      "IMC : <b style='font-size:20px'>"+imc.toFixed(1)+"</b> — "+cat+"<br>"+
      "Poids de forme : <b>"+idealMin.toFixed(1)+" à "+idealMax.toFixed(1)+" kg</b><br>"+
      "Métabolisme de base : <b>"+fmt(bmr,0)+" kcal/jour</b><br>"+
      "Besoin quotidien (activité incluse) : <b style='color:#00a583'>"+fmt(kcal,0)+" kcal/jour</b><br>"+
      "Pour perdre ~0,5 kg/semaine : ~"+fmt(kcal-500,0)+" kcal/jour · Pour prendre : ~"+fmt(kcal+300,0)+" kcal/jour";
  }
  ["imcH","imcW","imcA","imcAct"].forEach(id=>$(id).addEventListener("input",calc));
  calc();
};

INITS.avg=function(){
  const saved=lsGet("avg_rows",[{n:12,c:1},{n:15,c:2},{n:8,c:1}]);
  if(!Array.isArray(saved))saved=[{n:10,c:1}];
  function render(){
    const box=$("avgRows");box.innerHTML="";
    saved.forEach(function(r,i){
      const d=document.createElement("div");d.className="row";d.style.marginTop="8px";
      d.innerHTML='<input type="number" step="any" placeholder="Note /20" class="avgN">'+
        '<input type="number" step="any" placeholder="Coef" class="avgC" style="max-width:110px">'+
        '<button class="ghost" style="margin:0;max-width:44px">✕</button>';
      const inputs=d.querySelectorAll("input");
      inputs[0].value=r.n;inputs[1].value=r.c;
      inputs[0].addEventListener("input",()=>{saved[i].n=+inputs[0].value||0;lsSet("avg_rows",saved);calc();});
      inputs[1].addEventListener("input",()=>{saved[i].c=+inputs[1].value||0;lsSet("avg_rows",saved);calc();});
      d.querySelector("button").addEventListener("click",()=>{saved.splice(i,1);lsSet("avg_rows",saved);render();});
      box.appendChild(d);
    });
    calc();
  }
  function calc(){
    let sum=0,co=0,notes=[];
    saved.forEach(function(r){sum+=r.n*r.c;co+=r.c;
      if(r.c>0)notes.push(r.n);});
    if(!co){$("avgOut").textContent="Ajoutez des lignes.";$("avgDetail").textContent="";return;}
    const m=sum/co;
    $("avgOut").textContent=m.toFixed(2)+" / 20";
    const mini=Math.min.apply(null,notes),maxi=Math.max.apply(null,notes);
    $("avgDetail").textContent=notes.length+" notes · total coefficients : "+co+
      " · min : "+mini+" · max : "+maxi+
      " · mention : "+(m>=16?"félicitations 🎉":m>=14?"très bien 👏":m>=12?"bien 👍":m>=10?"passable 🙂":"insuffisant 😬");
  }
  $("avgAdd").addEventListener("click",()=>{saved.push({n:10,c:1});lsSet("avg_rows",saved);render();});
  render();
};

INITS.typing=function(){
  const PHRASES=["Le renard rapide saute par-dessus le chien paresseux près de la rivière bleue.",
    "Un voyage de mille lieues commence toujours par un premier pas vers l'horizon.",
    "Les mots que nous tapons aujourd'hui construisent les histoires de demain.",
    "La clarté du style vient surtout de la patience et d'un bon café du matin.",
    "Quarante-deux chats noirs rôdaient silencieusement dans la vieille bibliothèque municipale."];
  let best=lsGet("typing_best",null),startT=null,cur="";
  if(best)$("tyBest").textContent=best+" mots/min";
  function setPhrase(){
    cur=PHRASES[Math.floor(Math.random()*PHRASES.length)];
    const ta=$("typeArea");
    ta.innerHTML="";
    Array.from(cur).forEach(ch=>{
      const s=document.createElement("span");s.textContent=ch;ta.appendChild(s);
    });
    $("typeInput").value="";startT=null;
    $("tyOut").textContent="Tapez la phrase — le chrono démarre à la première lettre…";
  }
  function renderTyped(){
    const v=$("typeInput").value,spans=$("typeArea").querySelectorAll("span");
    spans.forEach(function(s,i){
      s.className="";
      if(i<v.length)s.className=v[i]===cur[i]?"ok":"bad";
    });
    return v.length===cur.length;
  }
  $("typeInput").addEventListener("input",()=>{
    if(!cur)return;
    if(!startT)startT=performance.now();
    const done=renderTyped();
    if(done){
      const ok=[...cur].every((c,i)=>v_ok(i));
      function v_ok(i){return $("typeInput").value[i]===cur[i];}
      const secs=(performance.now()-startT)/1000;
      const words=cur.split(" ").length;
      const wpm=Math.round(words/(secs/60));
      const prev=lsGet("typing_best",null);
      const isRecord=!prev||wpm>prev;
      if(isRecord)lsSet("typing_best",wpm);
      $("tyBest").textContent=Math.max(wpm,prev||0)+" mots/min";
      $("tyOut").innerHTML="⏱️ "+secs.toFixed(1)+" s · <b>"+wpm+" mots/min</b>"+
        (isRecord?" · 🏆 NOUVEAU RECORD !":"");
      cur="";$("typeInput").disabled=true;
      setTimeout(()=>{$("typeInput").disabled=false;setPhrase();},2500);
    }
  });
  $("tyStart").addEventListener("click",()=>{$("typeInput").disabled=false;setPhrase();$("typeInput").focus();});
  setPhrase();
};
INITS.pomo=function(){
  let minutes=25,remain=minutes*60,running=false,iv=null;
  const today=new Date().toDateString();
  let st=lsGet("pomo_state",{day:today,count:0});
  if(st.day!==today)st={day:today,count:0};
  $("pomoCount").textContent=st.count;
  function render(){
    const m=String(Math.floor(remain/60)).padStart(2,"0"),
          s=String(remain%60).padStart(2,"0");
    $("pomoTime").textContent=m+":"+s;
    document.title=running?"🍅 "+m+":"+s+" — Pomodoro":"🧰 Ma Boîte à Outils";
  }
  function beep(){
    try{
      const AC=new(window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.value=660;g.gain.value=.3;
      o.connect(g);g.connect(AC.destination);o.start();
      o.frequency.setValueAtTime(880,AC.currentTime+.2);
      o.stop(AC.currentTime+.5);
    }catch(e){}
  }
  function tick(){
    remain--;
    if(remain<=0){
      clearInterval(iv);running=false;remain=minutes*60;
      $("pomoStart").textContent="▶ Démarrer";
      if(minutes===25||minutes===50){
        st.count++;lsSet("pomo_state",st);$("pomoCount").textContent=st.count;
        beep();alert("🍅 Session terminée ! Pause bien méritée.");
      }else{beep();alert("☕ Pause terminée ! On repart pour du focus ?");}
    }
    render();
  }
  document.querySelectorAll("#pomoMode .chip").forEach(c=>c.addEventListener("click",()=>{
    document.querySelectorAll("#pomoMode .chip").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");
    minutes=+c.dataset.m;remain=minutes*60;render();
  }));
  $("pomoStart").addEventListener("click",()=>{
    running=!running;
    $("pomoStart").textContent=running?"⏸ Pause":"▶ Démarrer";
    if(running)iv=setInterval(tick,1000);
    else clearInterval(iv);
  });
  $("pomoReset").addEventListener("click",()=>{
    clearInterval(iv);running=false;remain=minutes*60;
    $("pomoStart").textContent="▶ Démarrer";render();
  });
  render();
};
</script>
