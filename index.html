<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🧰 Ma Boîte à Outils</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --txt:#241a4d;--dim:#6b6489;
  --r:20px;
  font-family:"Segoe UI",Inter,system-ui,sans-serif;
  --mx:50;--my:35;
}
html{scroll-behavior:smooth}
body{color:var(--txt);min-height:100vh;overflow-x:hidden}

/* ====== FOND ANIMÉ SUIVANT LA SOURIS ====== */
#bgFx{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#ff9a9e,#a18cd1,#fbc2eb,#8fd3f4);
  background-size:400% 400%;animation:gradShift 18s ease infinite}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bgGlow{position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background .18s linear;
  background:
    radial-gradient(560px circle at calc(var(--mx)*1%) calc(var(--my)*1%),rgba(255,236,120,.55),transparent 60%),
    radial-gradient(760px circle at calc(100% - var(--mx)*1%) calc(var(--my)*1%),rgba(120,220,255,.5),transparent 60%),
    radial-gradient(900px circle at calc(var(--mx)*1%) calc(100% - var(--my)*1%),rgba(255,130,220,.42),transparent 60%);
}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,.35))}

/* ====== TOPBAR ====== */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(255,255,255,.65);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.6)}
#topbar h1{font-size:17px;font-weight:900;letter-spacing:.5px;color:#2b1e63}
#btnHome{display:none;background:linear-gradient(135deg,#ff5c8a,#a18cd1);color:#fff;border:none;
  border-radius:14px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(161,140,209,.5)}
body.inTool #btnHome{display:inline-block}
#btnHome:active{transform:scale(.95)}
#crumb{color:var(--dim);font-size:12px;flex:1;text-align:right;font-weight:600}
#savedTag{display:none;font-size:10px;color:#00a583;font-weight:800;letter-spacing:1px}

/* ====== ACCUEIL ====== */
#home{max-width:1100px;margin:0 auto;padding:30px 16px 40px}
body.inTool #home{display:none}
#hero{text-align:center;margin-bottom:28px}
#hero h2{font-size:clamp(26px,5.5vw,44px);font-weight:900;letter-spacing:-.5px;color:#fff;
  text-shadow:0 2px 0 #c9a6ff,0 6px 24px rgba(90,60,180,.45)}
#hero p{color:#3a2f6b;margin-top:10px;font-size:13px;letter-spacing:1.5px;font-weight:700}
#menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mbtn{background:rgba(255,255,255,.82);border:none;border-radius:var(--r);padding:16px 10px;text-align:center;
  cursor:pointer;box-shadow:0 8px 24px rgba(80,50,160,.18);transition:.18s;
  display:flex;flex-direction:column;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.mbtn:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 34px rgba(80,50,160,.35)}
.mbtn:active{transform:scale(.96)}
.mbtn .ico{font-size:30px;width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.06)}
.mbtn b{font-size:13px;color:#2b1e63}
.mbtn small{font-size:10px;color:var(--dim);line-height:1.3}
.mbtn .save-dot{position:absolute}
.c1 .ico{background:#ffd6e3}.c2 .ico{background:#ffedb8}.c3 .ico{background:#c9f0ff}
.c4 .ico{background:#cdf5d2}.c5 .ico{background:#e4d5ff}.c6 .ico{background:#ffdfd0}
.c7 .ico{background:#d6e6ff}.c8 .ico{background:#ffe9c2}.c9 .ico{background:#c8f7e3}
.c10 .ico{background:#eed2ff}.c11 .ico{background:#ffd6ec}.c12 .ico{background:#ccf1ff}
.c13 .ico{background:#fff3bf}.c14 .ico{background:#e0f2c9}.c15 .ico{background:#f4d6ff}
.c16 .ico{background:#c9eaff}.c17 .ico{background:#ffe0c2}.c18 .ico{background:#d9f7ef}
.c19 .ico{background:#f7d6d6}.c20 .ico{background:#d6f7f0}.c21 .ico{background:#ffeacc}
.c22 .ico{background:#e6d6ff}
.mbtn.has-save{outline:2px dashed #00a583;outline-offset:-6px}

/* ====== PAGES OUTILS ====== */
.page{display:none;max-width:780px;margin:0 auto;padding:22px 16px 60px}
.page.show{display:block;animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tool-card{background:rgba(255,255,255,.9);border-radius:var(--r);box-shadow:0 10px 30px rgba(80,50,160,.2);
  padding:22px;margin-bottom:16px;backdrop-filter:blur(8px)}
.tool-card h3{font-size:18px;color:#2b1e63}
.tool-card .desc{color:var(--dim);font-size:12px;margin:4px 0 14px;font-weight:600}
label{display:block;font-size:12px;color:#584d80;margin:12px 0 5px;font-weight:700}
input,select,textarea{width:100%;background:#faf9ff;border:1.5px solid #e2def5;color:var(--txt);
  padding:11px 13px;border-radius:13px;font-size:15px;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:#a18cd1;background:#fff;box-shadow:0 0 0 3px rgba(161,140,209,.25)}
textarea{resize:vertical;min-height:70px}
button{background:linear-gradient(135deg,#8f7bff,#a18cd1);color:#fff;border:none;border-radius:13px;
  padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px;transition:.15s;font-family:inherit;
  box-shadow:0 5px 16px rgba(140,110,220,.35)}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:active{transform:scale(.96)}
button.ghost{background:rgba(255,255,255,.85);color:#2b1e63;box-shadow:0 3px 10px rgba(80,50,160,.15)}
button.green{background:linear-gradient(135deg,#00d4a0,#00a583);box-shadow:0 5px 16px rgba(0,180,140,.35)}
button.pink{background:linear-gradient(135deg,#ff6f9c,#e0306a);box-shadow:0 5px 16px rgba(255,90,140,.4)}
button.orange{background:linear-gradient(135deg,#ff9a3c,#e07020);box-shadow:0 5px 16px rgba(255,150,60,.4)}
.row{display:flex;gap:10px}.row>*{flex:1}
.out{background:#f4f1ff;border:1.5px dashed #cabcf0;border-radius:13px;padding:12px 14px;margin-top:12px;
  font-size:14px;min-height:38px;word-break:break-word;font-variant-numeric:tabular-nums;color:#3b3166}
.big{font-size:22px;font-weight:800;color:#4b2fd4}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:8px 14px;border-radius:22px;font-size:12px;border:1.5px solid #e2def5;
  background:#fff;color:#6b6489;cursor:pointer;font-weight:700;transition:.12s}
.chip:hover{border-color:#a18cd1}
.chip.sel{background:linear-gradient(135deg,#8f7bff,#c47bff);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(140,110,220,.4)}
.swatch{display:inline-block;width:42px;height:42px;border-radius:12px;border:2px solid #fff;cursor:pointer;margin:3px;
  box-shadow:0 3px 8px rgba(0,0,0,.2)}
#pixCanvas{image-rendering:pixelated;max-width:100%;border:1px solid #e2def5;border-radius:12px;background:
  repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.todo-item{display:flex;align-items:center;gap:10px;background:#f6f3ff;border-radius:13px;padding:10px 13px;margin-top:7px}
.todo-item.done span{text-decoration:line-through;color:var(--dim)}
.todo-item span{flex:1;font-size:14px}
.todo-item button{margin:0;padding:4px 10px;font-size:11px}
.kbdrow{display:flex;gap:6px;margin-top:6px}
.kbd{padding:14px 0;flex:1;min-width:52px;text-align:center;background:#f4f1ff;border:1px solid #e2def5;
  border-radius:13px;font-size:17px;cursor:pointer;font-weight:800;transition:.08s}
.kbd:active{background:#a18cd1;color:#fff}
.kbd.op{color:#7a5cd8}
.kbd.eq{background:linear-gradient(135deg,#8f7bff,#a18cd1);color:#fff}
#calcOut{text-align:right;font-size:26px;font-weight:800;min-height:32px;padding:14px;background:#f4f1ff;border-radius:13px;color:#3b3166}
.save-note{font-size:10px;color:#00a583;font-weight:700;letter-spacing:.5px;margin-top:8px}
footer{text-align:center;color:#4b3f7d;font-size:10px;padding:28px;letter-spacing:1.5px;font-weight:700}
#gradPrev{height:80px;border-radius:14px;margin-top:12px;border:1px solid #e2def5}
.notes-area{min-height:220px;font-size:15px;line-height:1.6}
/* vitesse de frappe */
#typeArea{background:#f6f3ff;border-radius:13px;padding:16px;font-size:16px;line-height:1.7;margin-top:12px;min-height:80px}
#typeArea .ok{color:#00a583;font-weight:700}
#typeArea .bad{color:#e0306a;text-decoration:underline}
#typeInput{margin-top:10px;font-size:16px}
/* pomodoro */
#pomoTime{font-size:52px;font-weight:900;text-align:center;color:#4b2fd8;margin:10px 0}
#pomoPrev{height:60px;border-radius:14px;margin-top:12px;border:1px solid #e2def5}
@media(max-width:600px){
  #menu{grid-template-columns:repeat(2,1fr);gap:10px}
  .mbtn{padding:12px 6px}.mbtn .ico{font-size:26px;width:50px;height:50px}
  .row{flex-direction:column}
}
</style>
</head>
<body>
<div id="bgFx"></div>
<div id="bgGlow"></div>

<div id="pages"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>(+n).toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:0});

/* ============ SAUVEGARDE GÉNÉRIQUE ============ */
function lsGet(key,def){
  try{const v=localStorage.getItem("nova_"+key);
    return v===null?def:JSON.parse(v);}
  catch(e){return def;}
}
function lsSet(key,val){
  try{localStorage.setItem("nova_"+key,JSON.stringify(val));}catch(e){}
  flashSaved();
}
function flashSaved(){
  const t=$("savedTag");
  t.style.display="inline";
  clearTimeout(flashSaved._t);
  flashSaved._t=setTimeout(()=>{t.style.display="none";},1400);
}

/* ============ FOND : halo qui suit le pointeur ============ */
(function(){
  const root=document.documentElement;
  let tx=50,ty=35,cx=50,cy=35;
  addEventListener("pointermove",e=>{
    tx=e.clientX/innerWidth*100;
    ty=e.clientY/innerHeight*100;
  },{passive:true});
  addEventListener("touchmove",e=>{
    if(e.touches[0]){tx=e.touches[0].clientX/innerWidth*100;ty=e.touches[0].clientY/innerHeight*100;}
  },{passive:true});
  (function anim(){
    cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
    root.style.setProperty("--mx",cx.toFixed(2));
    root.style.setProperty("--my",cy.toFixed(2));
    requestAnimationFrame(anim);
  })();
})();

/* ============ NAVIGATION ============ */
const menuEl=$("menu"),pagesEl=$("pages"),initDone=new Set();
const SAVED_TOOLS=new Set(["todo","notes","text","dice","pw","avg","typing","pomo","cur"]);
TOOLS.forEach(t=>{
  const b=document.createElement("button");
  b.className="mbtn "+t.cls+(SAVED_TOOLS.has(t.id)?" has-save":"");
  b.type="button";
  b.innerHTML='<span class="ico">'+t.ico+'</span><b>'+t.name+'</b><small>'+t.desc+'</small>';
  b.addEventListener("click",()=>go(t.id));
  menuEl.appendChild(b);
  const p=document.createElement("div");
  p.className="page";p.id="page-"+t.id;
  p.innerHTML='<div class="tool-card"><h3>'+t.ico+' '+t.name+'</h3><div class="desc">'+t.brief+'</div>'+t.html+'</div>';
  pagesEl.appendChild(p);
});
function go(id){
  const t=TOOLS.find(x=>x.id===id);if(!t)return;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  $("page-"+id).classList.add("show");
  document.body.classList.add("inTool");
  $("crumb").textContent=t.name;
  if(location.hash!=="#"+id)location.hash=id;
  scrollTo(0,0);
  if(!initDone.has(id)){
    initDone.add(id);
    try{INITS[id]&&INITS[id]();}
    catch(err){console.error(err);}
  }
}
function goHome(){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  document.body.classList.remove("inTool");
  $("crumb").textContent="";
  if(location.hash)history.replaceState(null,""," ");
}
$("btnHome").addEventListener("click",goHome);
addEventListener("hashchange",()=>{
  const id=location.hash.slice(1);
  if(TOOLS.some(x=>x.id===id))go(id);
  else if(!id)goHome();
},{passive:true});
if(location.hash&&TOOLS.some(t=>"#"+t.id===location.hash))go(location.hash.slice(1));

const INITS={};

/* ============ 1. PIXEL ART ============ */
INITS.pixel=function(){
  let pixImg=null,pixRows=null;
  const cv=$("pixCanvas"),ctx=cv.getContext("2d");
  const st=lsGet("pix_size",{w:16,h:16});
  $("pixW").value=st.w;$("pixH").value=st.h;
  $("pixFile").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{const im=new Image();im.onload=()=>{pixImg=im;go();};im.src=ev.target.result;};
    r.readAsDataURL(f);
  });
  function go(){
    if(!pixImg){alert("Choisissez d'abord une image !");return;}
    const w=Math.min(128,Math.max(2,+$("pixW").value||16));
    const h=Math.min(128,Math.max(2,+$("pixH").value||16));
    $("pixW").value=w;$("pixH").value=h;
    lsSet("pix_size",{w:w,h:h});
    cv.width=w;cv.height=h;
    ctx.clearRect(0,0,w,h);ctx.drawImage(pixImg,0,0,w,h);
    const d=ctx.getImageData(0,0,w,h).data,rows=[];
    for(let y=0;y<h;y++){
      const row=[];
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        row.push("#"+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,"0")).join(""));
      }
      rows.push(row.join(" "));
    }
    pixRows=rows;
    $("pixOut").textContent=rows.join("\n");
  }
  $("pixGo").addEventListener("click",go);
  $("pixCopy").addEventListener("click",()=>{
    if(!pixRows){alert("Rien à copier : convertissez d'abord une image.");return;}
    const txt=pixRows.join("\n");
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(
        ()=>alert("✅ Grille HEX copiée ! ("+pixRows.length+" lignes × "+pixRows[0].split(" ").length+" pixels)"),
        ()=>alert("Copie refusée — le texte reste sélectionnable en dessous."));
    else alert("Copie non dispo — le texte reste sélectionnable en dessous.");
  });
};

INITS.pw=function(){
  const sets={up:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",low:"abcdefghijklmnopqrstuvwxyz",num:"0123456789",spec:"!@#$%^&*()-_=+[]{};:,.<>?"},
        on=new Set(["up","low","num","spec"]);
  const cfg=lsGet("pw_cfg",{len:16,up:1,low:1,num:1,spec:1});
  $("pwLen").value=cfg.len;$("pwLenV").textContent=cfg.len;
  document.querySelectorAll("#pwOpts .chip").forEach(c=>{
    if(!cfg[c.dataset.k])c.classList.remove("sel"),on.delete(c.dataset.k);
    c.addEventListener("click",()=>{
      c.classList.toggle("sel");
      if(c.classList.contains("sel"))on.add(c.dataset.k);else on.delete(c.dataset.k);
      lsSet("pw_cfg",{len:+$("pwLen").value,up:on.has("up")?1:0,low:on.has("low")?1:0,num:on.has("num")?1:0,spec:on.has("spec")?1:0});
    });
  });
  $("pwLen").addEventListener("input",e=>{
    $("pwLenV").textContent=e.target.value;
    lsSet("pw_cfg",{len:+e.target.value,up:on.has("up")?1:0,low:on.has("low")?1:0,num:on.has("num")?1:0,spec:on.has("spec")?1:0});
  });
  function renderVault(){
    const list=lsGet("pw_vault",[]);
    const el=$("pwList");
    el.innerHTML=list.length?"":"<div class='out' style='border-style:solid;font-size:11px'>Aucun mot de passe enregistré. ⚠️ Ceci est un rappel pratique stocké en clair dans votre navigateur — évitez les mots de passe critiques.</div>";
    list.forEach(function(item,i){
      const d=document.createElement("div");d.className="todo-item";
      d.innerHTML="<span></span><button class='ghost'>📋</button><button class='ghost'>✕</button>";
      d.querySelector("span").textContent=item.name+" : "+item.pw;
      d.querySelectorAll("button")[0].addEventListener("click",function(){
        if(navigator.clipboard)navigator.clipboard.writeText(item.pw);
        alert("Mot de passe copié !");
      });
      d.querySelectorAll("button")[1].addEventListener("click",function(){
        const l=lsGet("pw_vault",[]);l.splice(i,1);lsSet("pw_vault",l);renderVault();
      });
      el.appendChild(d);
    });
  }
  $("pwGo").addEventListener("click",()=>{
    let pool="";on.forEach(k=>pool+=sets[k]);
    if(!pool){$("pwOut").textContent="Cochez au moins une option !";return;}
    const len=+$("pwLen").value,arr=new Uint32Array(len);
    crypto.getRandomValues(arr);
    let pw="";for(const n of arr)pw+=pool[n%pool.length];
    $("pwOut").textContent=pw;
    const bits=len*Math.log2(pool.length);
    $("pwStrength").textContent="Entropie : "+Math.round(bits)+" bits — "+
      (bits<40?"faible 😟":bits<70?"correct 🙂":"excellent 💪");
  });
  $("pwSave").addEventListener("click",()=>{
    const name=$("pwName").value.trim(),pw=$("pwOut").textContent;
    if(!name||pw==="Cliquez sur Générer"){alert("Générez un mot de passe et donnez-lui un nom.");return;}
    const l=lsGet("pw_vault",[]);l.push({name:name,pw:pw});
    lsSet("pw_vault",l.slice(-20));$("pwName").value="";renderVault();
  });
  renderVault();
};

/* ============ 3. UNITÉS ============ */
INITS.units=function(){
  const UNITS={
    len:{m:1,km:1000,cm:.01,mm:.001,"mile":1609.344,yd:.9144,"pied (ft)":.3048,"pouce (in)":.0254,"mille nautique":1852},
    mass:{kg:1,g:.001,t:1000,"livre (lb)":.45359237,"once (oz)":.028349523},
    temp:{"°C":1,"°F":1,"K":1},
    vol:{L:1,mL:.001,"m³":1000,"gallon US":3.785411784},
    data:{octet:1,Ko:1024,Mo:1048576,Go:1073741824,To:1099511627776}
  };
  const st=lsGet("units_state",{cat:"len",from:null,to:null,val:1});
  let cat=st.cat||"len";
  function fill(){
    const keys=Object.keys(UNITS[cat]);
    $("uFrom").innerHTML=keys.map(k=>"<option>"+k+"</option>").join("");
    $("uTo").innerHTML=keys.map(k=>"<option>"+k+"</option>").join("");
    $("uFrom").value=st.from&&keys.indexOf(st.from)>=0?st.from:keys[0];
    $("uTo").value=st.to&&keys.indexOf(st.to)>=0?st.to:keys[Math.min(1,keys.length-1)];
    conv();
  }
  function save(){lsSet("units_state",{cat:cat,from:$("uFrom").value,to:$("uTo").value,val:+$("uVal").value||0});}
  function conv(){
    const v=+$("uVal").value||0,f=$("uFrom").value,t=$("uTo").value;let r;
    if(cat==="temp"){
      const c=f==="°C"?v:f==="°F"?(v-32)*5/9:v-273.15;
      r=t==="°C"?c:t==="°F"?c*9/5+32:c+273.15;
    }else r=v*UNITS[cat][f]/UNITS[cat][t];
    $("uOut").textContent=fmt(v)+" "+f+" = "+fmt(r,6)+" "+t;
    save();
  }
  document.querySelectorAll("#uCat .chip").forEach(c=>c.addEventListener("click",()=>{
    document.querySelectorAll("#uCat .chip").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");cat=c.dataset.c;st.from=st.to=null;fill();save();
  }));
  if(st.cat&&st.cat!=="len"){
    const chip=document.querySelector("#uCat .chip[data-c='"+st.cat+"']");
    if(chip){document.querySelectorAll("#uCat .chip").forEach(x=>x.classList.remove("sel"));
      chip.classList.add("sel");cat=st.cat;}
  }
  $("uVal").value=st.val!=null?st.val:1;
  ["uVal","uFrom","uTo"].forEach(id=>$(id).addEventListener("input",conv));
  fill();
};

/* ============ 4. COULEURS ============ */
INITS.color=function(){
  const st=lsGet("color_last","#6c5cff");
  function h2r(h){h=h.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const n=parseInt(h,16);return isNaN(n)?null:[n>>16&255,n>>8&255,n&255];}
  function r2Hsl(r,g,b){r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
    if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
    return[Math.round(h),Math.round(s*100),Math.round(l*100)];}
  function hsl2h(h,s,l){s/=100;l/=100;
    const a=s*Math.min(l,1-l),f=function(n){const k=(n+h/30)%12;
      return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1))).toString(16).padStart(2,"0");};
    return"#"+f(0)+f(8)+f(4);}
  function upd(hex){
    const rgb=h2r(hex);if(!rgb)return;
    const r=rgb[0],g=rgb[1],b=rgb[2],hs=r2Hsl(r,g,b),h=hs[0],s=hs[1],l=hs[2];
    const lum=Math.round(.299*r+.587*g+.114*b);
    $("colHex").value=hex;$("colPick").value=hex;
    lsSet("color_last",hex);
    $("colOut").innerHTML="HEX <b>"+hex.toUpperCase()+"</b> · RGB <b>"+r+", "+g+", "+b+"</b> · HSL <b>"+h+"°, "+s+"%, "+l+"%</b><br>"+
      "Texte lisible sur ce fond : <b>"+(lum>128?"⬜ blanc":"⬛ noir")+"</b>";
    const pals=[h,(h+30)%360,(h+180)%360,(h+120)%360,(h+240)%360,(h+150)%360];
    $("palette").innerHTML=pals.map(function(hh){
      const hx=hsl2h(hh,s,l);
      return '<span class="swatch" style="background:'+hx+'" title="'+hx+' — cliquez pour copier" data-h="'+hx+'"></span>';
    }).join("");
    document.querySelectorAll("#palette .swatch").forEach(function(sw){
      sw.addEventListener("click",function(){
        if(navigator.clipboard)navigator.clipboard.writeText(sw.dataset.h);
        alert(sw.dataset.h+" copié !");
      });
    });
  }
  $("colPick").addEventListener("input",e=>upd(e.target.value));
  $("colGo").addEventListener("click",()=>{let v=$("colHex").value.trim();upd(v.charAt(0)==="#"?v:"#"+v);});
  upd(st);
};

/* ============ 5. CALCULATRICE ============ */
INITS.calc=function(){
  let expr="";
  const render=()=>{$("calcOut").textContent=expr||"0";};
  function press(k){
    if(k==="C")expr="";
    else if(k==="←")expr=expr.slice(0,-1);
    else if(k==="="){
      try{
        const c=expr.replace(/%/g,"/100").replace(/×/g,"*").replace(/÷/g,"/");
        if(c&&/^[0-9+\-*/().%\s]+$/.test(c))
          expr=String(Math.round(Function("\"use strict\";return("+c+")")()*1e10)/1e10);
      }catch(e){}
    }else expr+=k;
    render();
  }
  document.querySelectorAll("#page-calc .kbd").forEach(k=>k.addEventListener("click",()=>press(k.dataset.k)));
  addEventListener("keydown",function(e){
    if(!$("page-calc").classList.contains("show"))return;
    const tag=document.activeElement?document.activeElement.tagName:"";
    if(tag==="INPUT"||tag==="TEXTAREA")return;
    if(/^[0-9+\-*/().%]$/.test(e.key))press(e.key);
    else if(e.key==="Enter")press("=");
    else if(e.key==="Backspace")press("←");
    else if(e.key==="Escape")press("C");
  });
};

/* ============ 6. TO-DO ============ */
INITS.todo=function(){
  let todos=lsGet("todos",[]);
  if(!Array.isArray(todos))todos=[];
  const save=()=>lsSet("todos",todos);
  let hideDone=false;
  function render(){
    const L=$("todoList");L.innerHTML="";
    const shown=todos.filter(t=>!hideDone||!t.done);
    if(!shown.length)L.innerHTML='<div class="out" style="border-style:solid">'+(hideDone?"Toutes les tâches affichées sont terminées !":"Aucune tâche — profitez du vide 😌")+"</div>";
    todos.forEach(function(t,i){
      if(hideDone&&t.done)return;
      const d=document.createElement("div");d.className="todo-item"+(t.done?" done":"");
      d.innerHTML='<input type="checkbox"'+(t.done?" checked":"")+'><span></span><button class="ghost">✕</button>';

/* ============ 11. CHRONO ============ */
INITS.chrono=function(){
  let t0=0,acc=0,run=false,laps=[];
  function tick(){
    const ms=acc+(run?performance.now()-t0:0);
    const m=String(Math.floor(ms/60000)).padStart(2,"0"),
          s=String(Math.floor(ms/1000)%60).padStart(2,"0"),
          d=Math.floor(ms%1000/100);
    $("chronoOut").textContent=m+":"+s+"."+d;
    if(run)requestAnimationFrame(tick);
  }
  $("chStart").addEventListener("click",()=>{
    run=!run;$("chStart").textContent=run?"⏸ Pause":"▶ Démarrer";
    if(run){t0=performance.now();tick();}else acc+=performance.now()-t0;
  });
  $("chLap").addEventListener("click",()=>{
    const v=$("chronoOut").textContent;
    laps.unshift(v);laps=laps.slice(0,20);
    $("chLaps").innerHTML=laps.map((l,i)=>"Tour "+(laps.length-i)+" — <b>"+l+"</b>").join("<br>");
  });
  $("chReset").addEventListener("click",()=>{
    run=false;acc=0;laps=[];
    $("chStart").textContent="▶ Démarrer";
    $("chLaps").innerHTML="";$("chronoOut").textContent="00:00.0";
  });
  $("tmGo").addEventListener("click",()=>{
    const min=+$("tmMin").value||0,end=Date.now()+min*60000,btn=$("tmGo");
    btn.disabled=true;
    const iv=setInterval(()=>{
      const left=end-Date.now();
      btn.textContent="⏳ reste "+Math.max(0,Math.ceil(left/1000))+" s";
      if(left<=0){
        clearInterval(iv);btn.disabled=false;btn.textContent="🔔 Lancer le minuteur";
        try{
          const AC=new(window.AudioContext||window.webkitAudioContext)();
          const o=AC.createOscillator(),g=AC.createGain();
          o.frequency.value=880;g.gain.value=.3;
          o.connect(g);g.connect(AC.destination);o.start();
          o.stop(AC.currentTime+.5);
        }catch(e){}
        alert("⏰ C'est l'heure ! ("+min+" min écoulées)");
      }
    },500);
  });
};

INITS.dates=function(){
  const today=new Date().toISOString().slice(0,10);
  $("da1").value=lsGet("date_birth","2000-01-01");
  $("da2").value=today;
  $("dbDate").value=today;
  function diff(){
    const a=new Date($("da1").value),b=new Date($("da2").value);
    if(isNaN(a)||isNaN(b)){$("daOut").textContent="Choisissez deux dates valides.";return;}
    lsSet("date_birth",$("da1").value);
    const ms=b-a,days=Math.round(ms/86400000);
    let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
    if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();}
    if(m<0){y--;m+=12;}
    const start=new Date(a);start.setHours(0,0,0,0);
    let wd=0;const tmp=new Date(start);
    while(tmp<b){if(tmp.getDay()!==0&&tmp.getDay()!==6)wd++;tmp.setDate(tmp.getDate()+1);}
    $("daOut").innerHTML=
      "Écart : <b>"+y+" ans "+m+" mois "+d+" jours</b><br>"+
      "Soit <b>"+fmt(days,0)+" jours</b> · <b>"+fmt(Math.round(days/7),0)+" semaines</b> · <b>"+fmt(days/365.25,1)+" années</b><br>"+
      "Jours ouvrés (hors week-ends) : <b>"+fmt(wd,0)+"</b> · Heures : <b>"+fmt(days*24,0)+"</b>";
  }
  function addDays(){
    const base=new Date($("dbDate").value),n=+$("dbDays").value||0;
    if(isNaN(base)){$("dbOut").textContent="Choisissez une date de départ.";return;}
    const r=new Date(base);r.setDate(r.getDate()+n);
    const opts={weekday:"long",day:"numeric",month:"long",year:"numeric"};
    $("dbOut").textContent=(n>=0?"+":"")+n+" jours → "+r.toLocaleDateString("fr-FR",opts);
  }
  $("daGo").addEventListener("click",diff);
  $("dbGo").addEventListener("click",addDays);
  ["da1","da2"].forEach(id=>$(id).addEventListener("change",diff));
  diff();
};

INITS.cur=function(){
  const FALLBACK={EUR:1,USD:1.08,GBP:0.85,CHF:0.94,CAD:1.47,JPY:168.5,CNY:7.7,AUD:1.65,
    MAD:10.8,DZD:145,TND:3.4,SEK:11.4,NOK:11.7,DKK:7.46,PLN:4.3,BRL:6.1,MXN:19.5,INR:90};
  const NAMES={EUR:"Euro €",USD:"Dollar US $",GBP:"Livre £",CHF:"Franc suisse",CAD:"Dollar canadien",
    JPY:"Yen ¥",CNY:"Yuan ¥",AUD:"Dollar australien",MAD:"Dirham marocain",DZD:"Dinar algérien",
    TND:"Dinar tunisien",SEK:"Couronne suédoise",NOK:"Couronne norvégienne",DKK:"Couronne danoise",
    PLN:"Zloty",BRL:"Real",MXN:"Peso",INR:"Roupie"};
  const st=lsGet("cur_state",{val:100,from:"EUR",to:"USD"});
  let rates=null;
  function fillSelects(){
    const keys=Object.keys(NAMES);
    $("curFrom").innerHTML=keys.map(k=>"<option value='"+k+"'>"+NAMES[k]+"</option>").join("");
    $("curTo").innerHTML=keys.map(k=>"<option value='"+k+"'>"+NAMES[k]+"</option>").join("");
    $("curFrom").value=st.from;$("curTo").value=st.to;
  }
  function conv2(){
    const v=+$("curVal").value||0,f=$("curFrom").value,t=$("curTo").value;
    lsSet("cur_state",{val:v,from:f,to:t});
    if(!rates){$("curOut").textContent="Chargement des taux…";return;}
    const r=v*rates[t]/rates[f];
    $("curOut").textContent=fmt(v,2)+" "+f+" = "+fmt(r,2)+" "+t;
  }
  function applyRates(data,label){
    rates=data;
    $("curInfo").textContent=label;
    conv2();
  }
  async function loadRates(force){
    const cache=lsGet("cur_cache",null);
    const fresh=cache&&(Date.now()-cache.t)<86400000;
    if(!force&&fresh){applyRates(cache.r,"Taux du cache (mis à jour "+new Date(cache.t).toLocaleString("fr-FR")+" )");return;}
    if(!navigator.onLine){applyRates(FALLBACK,"⚠️ Hors-ligne : taux indicatifs figés");return;}
    try{
      const resp=await fetch("https://open.er-api.com/v6/latest/EUR");
      if(!resp.ok)throw new Error("http");
      const j=await resp.json();
      if(j&&j.rates){
        const sel={};Object.keys(NAMES).forEach(k=>{if(j.rates[k])sel[k]=j.rates[k];});
        lsSet("cur_cache",{t:Date.now(),rates:sel});
        applyRates(sel,"Taux en direct (open.er-api.com), mis à jour "+new Date().toLocaleTimeString("fr-FR"));
      }else throw new Error("bad");
    }catch(e){applyRates(FALLBACK,"⚠️ Impossible de récupérer les taux en ligne — taux indicatifs figés");}
  }
  $("curVal").value=st.val;
  fillSelects();
  $("curVal").addEventListener("input",conv2);
  $("curFrom").addEventListener("change",conv2);
  $("curTo").addEventListener("change",conv2);
  $("curGo").addEventListener("click",conv2);
  $("curRefresh").addEventListener("click",()=>loadRates(true));
  loadRates(false);
};

INITS.avg=function(){
  const saved=lsGet("avg_rows",[{n:12,c:1},{n:15,c:2},{n:8,c:1}]);
  function render(){
    const box=$("avgRows");box.innerHTML="";
    saved.forEach(function(r,i){

      d.innerHTML='<input type="number" step="any" placeholder="Note /20" class="avgN">'+

        '<button class="ghost" style="margin:0;max-width:44px">✕</button>';

  $("grB").addEventListener("input",upd);
  $("grAng").addEventListener("input",upd);
  document.querySelectorAll("#grPresets .chip").forEach(c=>c.addEventListener("click",()=>{
    $("grA").value=c.dataset.a;$("grB").value=c.dataset.b;upd();
  }));
  $("grCopy").addEventListener("click",()=>{
    if(navigator.clipboard)navigator.clipboard.writeText("background: "+$("grOut").textContent.replace(/^background: |;$/g,"")+";")
      .then(()=>alert("Code CSS copié !"));
  });
  upd();
};

/* ============ 21. VITESSE DE FRAPPE ============ */
INITS.typing=function(){
  const PHRASES=["Le renard rapide saute par-dessus le chien paresseux près de la rivière bleue.",
    "Un voyage de mille lieues commence toujours par un premier pas vers l'horizon.",
    "Les mots que nous tapons aujourd'hui construisent les histoires de demain.",
    "La clarté du style vient surtout de la patience et d'un bon café du matin.",
    "Quarante-deux chats noirs rôdaient silencieusement dans la vieille bibliothèque municipale."];
  let best=lsGet("typing_best",null),startT=null,cur="";
  if(best)$("tyBest").textContent=best+" mots/min";
  function setPhrase(){
    cur=PHRASES[Math.floor(Math.random()*PHRASES.length)];
    const ta=$("typeArea");
    ta.innerHTML="";
    Array.from(cur).forEach(ch=>{
      const s=document.createElement("span");s.textContent=ch;ta.appendChild(s);
    });
    $("typeInput").value="";startT=null;
    $("tyOut").textContent="Tapez la phrase dès votre première lettre…";
  }
  function renderTyped(){
    const v=$("typeInput").value,spans=$("typeArea").querySelectorAll("span");
    let ok=true;
    spans.forEach(function(s,i){
      s.className="";
      if(i<v.length){
        if(v[i]===cur[i])s.className="ok";
        else{s.className="bad";ok=false;}
      }
    });
    return ok&&v.length===cur.length;
  }
  $("typeInput").addEventListener("input",()=>{
    if(!cur)return;
    if(!startT)startT=performance.now();
    const done=renderTyped();
    if(done){
      const secs=(performance.now()-startT)/1000;
      const words=cur.split(" ").length;
      const wpm=Math.round(words/(secs/60));
      const prev=lsGet("typing_best",null);
      const isRecord=!prev||wpm>prev;
      if(isRecord)lsSet("typing_best",wpm);
      $("tyBest").textContent=Math.max(wpm,prev||0)+" mots/min";
      $("tyOut").innerHTML="⏱️ "+secs.toFixed(1)+" s · <b>"+wpm+" mots/min</b>"+
        (isRecord?" · 🏆 NOUVEAU RECORD !":"");
      cur="";$("typeInput").disabled=true;
      setTimeout(()=>{$("typeInput").disabled=false;setPhrase();},2500);
    }
  });
  $("tyStart").addEventListener("click",()=>{$("typeInput").disabled=false;setPhrase();$("typeInput").focus();});
  setPhrase();
};

/* ============ 22. POMODORO ============ */
INITS.pomo=function(){
  let minutes=25,remain=minutes*60,running=false,iv=null;
  const today=new Date().toDateString();
  let st=lsGet("pomo_state",{day:today,count:0});
  if(st.day!==today)st={day:today,count:0};
  $("pomoCount").textContent=st.count;
  function render(){
    const m=String(Math.floor(remain/60)).padStart(2,"0"),
          s=String(remain%60).padStart(2,"0");
    $("pomoTime").textContent=m+":"+s;
    document.title=running?"🍅 "+m+":"+s+" — Pomodoro":"🧰 Ma Boîte à Outils";
  }
  function beep(){
    try{
      const AC=new(window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.value=660;g.gain.value=.3;
      o.connect(g);g.connect(AC.destination);o.start();
      o.frequency.setValueAtTime(880,AC.currentTime+.2);
      o.stop(AC.currentTime+.5);
    }catch(e){}
  }
  function tick(){
    remain--;
    if(remain<=0){
      clearInterval(iv);running=false;remain=minutes*60;
      $("pomoStart").textContent="▶ Démarrer";
      if(minutes===25||minutes===50){
        st.count++;lsSet("pomo_state",st);$("pomoCount").textContent=st.count;
        beep();alert("🍅 Session terminée ! Pause bien méritée.");
      }else{beep();alert("☕ Pause terminée ! On repart pour du focus ?");}
    }
    render();
  }
  document.querySelectorAll("#pomoMode .chip").forEach(c=>c.addEventListener("click",()=>{
    document.querySelectorAll("#pomoMode .chip").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");
    minutes=+c.dataset.m;remain=minutes*60;render();
  }));
  $("pomoStart").addEventListener("click",()=>{
    running=!running;
    $("pomoStart").textContent=running?"⏸ Pause":"▶ Démarrer";
    if(running)iv=setInterval(tick,1000);
    else clearInterval(iv);
  });
  $("pomoReset").addEventListener("click",()=>{
    clearInterval(iv);running=false;remain=minutes*60;
    $("pomoStart").textContent="▶ Démarrer";render();
  });
  render();
};
</script>
